<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="120" viewBox="0 0 1200 120" role="img" aria-label="Terminal: connect with Folarihn. Links follow.">
<title>Terminal: connect with Folarihn. Links follow.</title>
<style>
text{font-family:'JetBrains Mono','SFMono-Regular','Cascadia Code',Consolas,'Liberation Mono',monospace;}

.ty{animation:ty 2.4s steps(32) .4s both}
@keyframes ty{from{width:0}to{width:311px}}
.cur{animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.res{opacity:0;animation:in .4s ease-out 3s forwards}
@keyframes in{to{opacity:1}}

@media (prefers-reduced-motion: reduce){*{animation:none!important;opacity:1!important}}
</style>
<defs><clipPath id="tc"><rect class="ty" x="200" y="20" width="0" height="34"/></clipPath></defs>
<rect x=".5" y=".5" width="1199" height="119" rx="12" fill="#0a1117" stroke="#14303a"/>
<text x="28" y="44" font-size="16"><tspan fill="#3dff9a">folarihn@build</tspan><tspan fill="#6b8495">:~$ </tspan></text>
<text x="200" y="44" fill="#d4e1ea" font-size="16" clip-path="url(#tc)">connect --portfolio --x --github</text>
<rect class="cur" x="515" y="30" width="10" height="18" fill="#3dff9a"/>
<text class="res" x="28" y="86" font-size="15"><tspan fill="#3dff9a">✓ </tspan><tspan fill="#d4e1ea">3 channels open </tspan><tspan fill="#6b8495">— links below. open to collabs, audits and agent builds.</tspan></text>
</svg>
