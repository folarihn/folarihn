<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="64" viewBox="0 0 1200 64" role="img" aria-label="activity: commits, eaten daily">
<title>activity: commits, eaten daily</title>
<style>
text{font-family:'JetBrains Mono','SFMono-Regular','Cascadia Code',Consolas,'Liberation Mono',monospace;}

.cur{animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.run{stroke-dasharray:6 10;animation:run 1.8s linear infinite}
@keyframes run{to{stroke-dashoffset:-32}}

@media (prefers-reduced-motion: reduce){*{animation:none!important;opacity:1!important}}
</style>
<text x="4" y="40" font-size="24" font-weight="800"><tspan fill="#3dff9a">~/</tspan><tspan fill="#d4e1ea">activity</tspan></text>
<rect class="cur" x="172" y="20" width="12" height="24" fill="#3dff9a"/>
<line class="run" x1="200" y1="32" x2="920" y2="32" stroke="#14303a" stroke-width="2"/>
<text x="1196" y="38" text-anchor="end" fill="#6b8495" font-size="13">commits, eaten daily</text>
</svg>
