name: Contribution snake
on:
  schedule:
    - cron: '17 */12 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/snake.yml]
permissions:
  contents: write
concurrency:
  group: snake
  cancel-in-progress: true
jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#0a7a4a&color_dots=#ebedf0,#b6f5d4,#5ee0a0,#22b873,#0a7a4a
            dist/snake-dark.svg?palette=github-dark&color_snake=#3dff9a&color_dots=#0a1117,#0d3b2a,#14704a,#22b873,#3dff9a
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
