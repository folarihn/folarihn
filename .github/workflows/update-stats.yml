name: Update public profile statistics
on:
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: profile-public-stats
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - name: Fetch public-only API data and render stats
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update-stats.py
      - run: python -m unittest discover -s tests -v
      - run: python scripts/validate.py
      - name: Commit only changed public stats
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git add -- README.md assets/generated/public-stats.json assets/generated/github-stats.svg assets/generated/github-metrics.svg assets/generated/github-metrics-mobile.svg assets/generated/github-stats-mobile.svg
          if git diff --cached --quiet; then
            echo "Public data unchanged; no commit."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Refresh public GitHub snapshot'
          gh auth setup-git
          git push
